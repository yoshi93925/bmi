<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AIカロリーチェッカー＆食事管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { overflow-x: hidden; touch-action: pan-y; }
    .calendar-day-red { background-color: #fecdd3; color: #e11d48; font-weight: bold; border-radius: 9999px; }
    .calendar-day-green { background-color: #d1fae5; color: #059669; font-weight: bold; border-radius: 9999px; }

    /* 左右スワイプアニメーション */
    .slide-left {
      animation: slideLeft 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .slide-right {
      animation: slideRight 0.25s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes slideLeft {
      0% { transform: translateX(20px); opacity: 0.6; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideRight {
      0% { transform: translateX(-20px); opacity: 0.6; }
      100% { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 flex justify-center items-start text-slate-800">

  <div id="appContainer" class="max-w-md w-full bg-white rounded-3xl shadow-xl p-5 space-y-4 my-2 select-none border border-slate-200/60 transition-all">
    
    <!-- ヘッダー -->
    <div class="flex justify-between items-center">
      <!-- カレンダーボタン -->
      <button onclick="openCalendarModal()" class="flex items-center space-x-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-3 py-1.5 rounded-xl border border-emerald-200/60 transition active:scale-95 shadow-sm">
        <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-xs">カレンダー</span>
      </button>

      <div class="flex items-center space-x-1.5">
        <!-- ログイン / ログアウトボタンエリア -->
        <div id="authArea">
          <button id="loginBtn" onclick="loginWithGoogle()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-xl transition shadow-sm flex items-center gap-1 active:scale-95">
            <span>Googleログイン</span>
          </button>
          <button id="logoutBtn" onclick="logoutFromGoogle()" class="hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-2.5 py-1.5 rounded-xl border border-slate-200 transition">
            ログアウト
          </button>
        </div>

        <!-- 設定ボタン（⚙️） -->
        <button onclick="openTargetModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-2.5 py-1.5 rounded-xl border border-slate-200 transition active:scale-95">
          ⚙️ 設定
        </button>
      </div>
    </div>

    <!-- 7日間の日付＆曜日タブナビゲーション -->
    <div>
      <div id="weekDaysContainer" class="grid grid-cols-7 gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80 text-center">
        <!-- JSで動的生成 -->
      </div>
    </div>

    <!-- メインコンテンツエリア -->
    <div id="mainContentArea" class="space-y-4">
      
      <!-- 1日の合計エリア -->
      <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-3.5 shadow-sm">
        <div class="flex justify-between items-center">
          <h2 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
            <span>📊 本日の摂取量 / 目標</span>
          </h2>
          <span id="dateBadge" class="text-[10px] bg-slate-200/80 text-slate-700 font-mono px-2.5 py-0.5 rounded-full border border-slate-300/60 font-bold"></span>
        </div>

        <!-- カロリー比較 -->
        <div class="space-y-1">
          <div class="flex justify-between items-baseline">
            <span class="text-xs text-slate-600 font-bold">総カロリー</span>
            <div class="font-mono">
              <span id="totalCalories" class="text-2xl font-black">0</span>
              <span class="text-slate-400 text-xs">/</span>
              <span id="targetCaloriesDisplay" class="text-sm font-semibold text-slate-500">2000</span>
              <span class="text-xs text-slate-400 ml-0.5">kcal</span>
            </div>
          </div>
          <div class="w-full bg-slate-200/80 h-2 rounded-full overflow-hidden">
            <div id="barCalories" class="h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
        
        <!-- PFC比較 -->
        <div class="grid grid-cols-3 gap-2 pt-1 border-t border-slate-200 text-center">
          <div class="bg-white p-2 rounded-xl space-y-1 border border-slate-200/80 shadow-sm">
            <div class="text-[10px] text-blue-600 font-bold">タンパク質</div>
            <div class="text-xs font-bold font-mono">
              <span id="totalProtein" class="text-blue-600">0</span>
              <span class="text-slate-400 text-[10px]">/</span>
              <span id="targetProteinDisplay" class="text-slate-400 text-[10px]">100</span><span class="text-[10px] text-slate-400">g</span>
            </div>
            <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
              <div id="barProtein" class="bg-blue-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>

          <div class="bg-white p-2 rounded-xl space-y-1 border border-slate-200/80 shadow-sm">
            <div class="text-[10px] text-amber-600 font-bold">脂質</div>
            <div class="text-xs font-bold font-mono">
              <span id="totalFat" class="text-amber-600">0</span>
              <span class="text-slate-400 text-[10px]">/</span>
              <span id="targetFatDisplay" class="text-slate-400 text-[10px]">50</span><span class="text-[10px] text-slate-400">g</span>
            </div>
            <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
              <div id="barFat" class="h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>

          <div class="bg-white p-2 rounded-xl space-y-1 border border-slate-200/80 shadow-sm">
            <div class="text-[10px] text-emerald-600 font-bold">炭水化物</div>
            <div class="text-xs font-bold font-mono">
              <span id="totalCarbs" class="text-emerald-600">0</span>
              <span class="text-slate-400 text-[10px]">/</span>
              <span id="targetCarbsDisplay" class="text-slate-400 text-[10px]">250</span><span class="text-[10px] text-slate-400">g</span>
            </div>
            <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden">
              <div id="barCarbs" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- よく食べるもの -->
      <div class="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-3 space-y-2">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-amber-900 flex items-center gap-1">
            ⭐ よく食べるもの
          </h2>
          <div class="flex items-center space-x-2">
            <button onclick="openSelectFavoriteModal()" class="text-[10px] bg-amber-200/80 hover:bg-amber-300/80 text-amber-900 font-bold px-2 py-0.5 rounded-lg transition">
              📋 リストから選ぶ
            </button>
            <button onclick="openFavoriteModal()" class="text-[10px] text-amber-700 hover:underline font-bold">
              ＋ 追加
            </button>
          </div>
        </div>
        <div id="favoritesContainer" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- 統合入力フォーム -->
      <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex justify-between items-center">
          <label class="block text-xs font-bold text-slate-700">🍴 食事の追加</label>
          <span id="aiStatusBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full animate-pulse">✨ AI解析完了</span>
        </div>

        <input type="file" id="albumInput" accept="image/*" class="hidden" onchange="analyzePhotoAndFillForm(event)">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="analyzePhotoAndFillForm(event)">

        <div>
          <div class="flex items-center space-x-1.5">
            <input type="text" id="manualName" placeholder="例: 牛丼並盛り、プロテイン" class="flex-1 text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm">
            
            <!-- アルバムアイコン -->
            <button onclick="document.getElementById('albumInput').click()" title="アルバムから選択" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-300/80 font-bold p-2.5 rounded-xl flex items-center justify-center transition active:scale-95 shrink-0 shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </button>

            <!-- カメラアイコン -->
            <button onclick="document.getElementById('cameraInput').click()" title="カメラで撮影" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-300/80 font-bold p-2.5 rounded-xl flex items-center justify-center transition active:scale-95 shrink-0 shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
          </div>
          
          <div id="previewContainer" class="hidden mt-2 relative">
            <img id="imagePreview" class="max-h-32 mx-auto rounded-xl object-cover border border-slate-200">
            <button onclick="clearPhotoPreview()" class="absolute top-1 right-1 bg-slate-800/80 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold">×</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">カロリー (kcal)</label>
            <input type="number" id="manualCalories" placeholder="空欄でAI推定" class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">タンパク質 (g)</label>
            <input type="number" id="manualProtein" placeholder="空欄でAI推定" class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">脂質 (g)</label>
            <input type="number" id="manualFat" placeholder="空欄でAI推定" class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">炭水化物 (g)</label>
            <input type="number" id="manualCarbs" placeholder="空欄でAI推定" class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
          </div>
        </div>

        <button id="manualAddBtn" onclick="addManualLog()" class="w-full bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-xl hover:bg-emerald-600 transition shadow-sm mt-1 active:scale-95">
          ＋ 記録に追加する
        </button>

        <div id="manualLoading" class="hidden text-center py-2">
          <div class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-emerald-500 border-t-transparent"></div>
          <p class="text-[11px] text-slate-500 mt-1" id="loadingText">AIが栄養素を解析中...</p>
        </div>
      </div>

      <!-- 食事ログ＆習慣エリア -->
      <div class="border-t border-slate-200/80 pt-4 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-slate-800 flex items-center gap-1.5" id="logListTitle">
            📝 選択日の食事ログ
          </h2>
          <button onclick="clearCurrentDateLog()" class="text-[11px] text-rose-500 hover:underline font-bold">この日をクリア</button>
        </div>

        <!-- オーバー警告サマリーカード -->
        <div id="habitSummaryStatus" class="hidden p-2.5 rounded-xl text-xs font-bold flex justify-between items-center"></div>

        <div id="logList" class="space-y-2 max-h-72 overflow-y-auto text-xs text-slate-500"></div>
      </div>

    </div>
  </div>

  <!-- よく食べるもの：検索＆選択モーダル -->
  <div id="selectFavoriteModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-5 max-w-xs w-full space-y-3 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800">📋 よく食べるものから選択</h3>
        <button onclick="closeSelectFavoriteModal()" class="text-slate-400 font-bold hover:text-slate-600">×</button>
      </div>

      <input type="text" id="favSearchInput" oninput="renderSelectFavoriteList()" placeholder="アイテム名で検索..." class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">

      <div id="selectFavoriteList" class="space-y-1.5 overflow-y-auto flex-1 pr-1 text-xs"></div>

      <button onclick="closeSelectFavoriteModal()" class="w-full bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl hover:bg-slate-200 transition">閉じる</button>
    </div>
  </div>

  <!-- カレンダーモーダル -->
  <div id="calendarModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-5 max-w-xs w-full space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-sm font-bold text-slate-800" id="calendarMonthTitle">2026年 8月</h3>
        <div class="flex space-x-1">
          <button onclick="changeCalendarMonth(-1)" class="p-1 text-slate-500 hover:bg-slate-100 rounded-lg">◀</button>
          <button onclick="changeCalendarMonth(1)" class="p-1 text-slate-500 hover:bg-slate-100 rounded-lg">▶</button>
        </div>
      </div>

      <div class="flex justify-center space-x-4 text-[10px] text-slate-500 font-medium">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-200 inline-block"></span> 適正・目標内</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-200 inline-block"></span> 脂質/炭水化物/カロリー超過</span>
      </div>

      <div class="grid grid-cols-7 text-center text-[10px] font-bold text-slate-400">
        <span class="text-rose-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-blue-400">土</span>
      </div>

      <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>

      <button onclick="closeCalendarModal()" class="w-full bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl hover:bg-slate-200 transition">閉じる</button>
    </div>
  </div>

  <!-- 目標＆APIキー設定モーダル -->
  <div id="targetModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-xs w-full space-y-4">
      <h3 class="text-base font-bold text-slate-800 border-b pb-2">⚙️ 目標＆Gemini API設定</h3>
      
      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">🔑 Gemini APIキー</label>
        <input type="password" id="inputGeminiApiKey" placeholder="AIzaSy..." class="w-full text-xs p-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
        <p class="text-[10px] text-slate-400">※Googleログイン時、アカウントに暗号化同期保存されます。</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">目標カロリー (kcal)</label>
        <input type="number" id="inputTargetCalories" placeholder="2000" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">タンパク質 (g)</label>
          <input type="number" id="inputTargetProtein" placeholder="100" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">脂質 (g)</label>
          <input type="number" id="inputTargetFat" placeholder="50" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">炭水化物 (g)</label>
          <input type="number" id="inputTargetCarbs" placeholder="250" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>
      <div class="flex space-x-2 pt-2">
        <button onclick="closeTargetModal()" class="flex-1 bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl hover:bg-slate-200 transition">キャンセル</button>
        <button onclick="saveTargetValues()" class="flex-1 bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl hover:bg-emerald-600 transition shadow-sm">設定を保存</button>
      </div>
    </div>
  </div>

  <!-- よく食べるもの 管理モーダル -->
  <div id="favoriteModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-5 max-w-xs w-full space-y-4 max-h-[90vh] overflow-y-auto">
      <h3 class="text-base font-bold text-slate-800 border-b pb-2">⭐ よく食べるものの管理</h3>
      
      <div class="space-y-2 bg-amber-50/60 p-3 rounded-2xl border border-amber-200/60">
        <div class="text-xs font-bold text-amber-900">新規登録</div>
        <input type="text" id="favInputName" placeholder="料理名 (例: プロテイン)" class="w-full text-xs p-2 border border-slate-300 rounded-xl">
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="favInputCalories" placeholder="カロリー(kcal)" class="text-xs p-2 border border-slate-300 rounded-xl">
          <input type="number" id="favInputProtein" placeholder="タンパク質(g)" class="text-xs p-2 border border-slate-300 rounded-xl">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="favInputFat" placeholder="脂質(g)" class="text-xs p-2 border border-slate-300 rounded-xl">
          <input type="number" id="favInputCarbs" placeholder="炭水化物(g)" class="text-xs p-2 border border-slate-300 rounded-xl">
        </div>
        <div class="flex items-center space-x-1.5 pt-1">
          <input type="checkbox" id="favInputPinned" class="rounded border-slate-300 text-amber-500 focus:ring-amber-400">
          <label for="favInputPinned" class="text-xs font-bold text-amber-900">TOPページに固定表示する（お気に入り）</label>
        </div>
        <button onclick="addNewFavorite()" class="w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold py-2 rounded-xl transition shadow-sm mt-1">追加する</button>
      </div>

      <div class="space-y-2">
        <div class="text-xs font-bold text-slate-700">登録済みリスト（⭐でTOP表示切替）</div>
        <div id="favoriteManageList" class="space-y-1.5 max-h-40 overflow-y-auto text-xs"></div>
      </div>

      <button onclick="closeFavoriteModal()" class="w-full bg-slate-100 text-slate-600 text-xs font-bold py-2 rounded-xl hover:bg-slate-200 transition">閉じる</button>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div id="editModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-xs w-full space-y-4">
      <h3 class="text-base font-bold text-slate-800 border-b pb-2">記録の編集</h3>
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">料理名・食品名</label>
        <input type="text" id="editName" class="w-full text-xs p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">カロリー (kcal)</label>

    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {

      authDomain: "bmidown.firebaseapp.com",
      projectId: "bmidown",
      storageBucket: "bmidown.firebasestorage.app",
      messagingSenderId: "190194371045",
      appId: "1:190194371045:web:accb081fd0984f4146070c",
      measurementId: "G-5BKQKN8CTY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch(console.error);

    let currentUser = null;
    let unsubscribeSnapshot = null;

    window.loginWithGoogle = async function() {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
          await signInWithRedirect(auth, provider);
        } else {
          alert("ログイン処理に失敗しました: " + err.message);
        }
      }
    };

    getRedirectResult(auth).catch((err) => {
      if (err.code !== 'auth/popup-closed-by-user') {
        console.error("Redirect Result Error:", err);
      }
    });

    window.logoutFromGoogle = async function() {
      try {
        await signOut(auth);
        location.reload();
      } catch (err) {
        alert("ログアウトに失敗しました");
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');

        subscribeCloudData(user.uid);
      } else {
        currentUser = null;
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
      }
    });

    function subscribeCloudData(uid) {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const userDocRef = doc(db, "users", uid);
      unsubscribeSnapshot = onSnapshot(userDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.foodLogs) window.foodLogs = data.foodLogs;
          if (data.userTargets) window.userTargets = data.userTargets;
          if (data.favoritesList) window.favoritesList = data.favoritesList;
          if (data.geminiApiKey) {
            window.userGeminiApiKey = data.geminiApiKey;
            localStorage.setItem('user_gemini_api_key', data.geminiApiKey);
          }
          
          window.updateUI();
          window.renderWeekDays();
        } else {
          window.syncDataToCloud();
        }
      });
    }

    window.syncDataToCloud = async function() {
      if (!currentUser) return;
      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        await setDoc(userDocRef, {
          foodLogs: window.foodLogs || [],
          userTargets: window.userTargets || {},
          favoritesList: window.favoritesList || [],
          geminiApiKey: window.userGeminiApiKey || "",
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (err) {
        console.error("クラウド自動保存エラー:", err);
      }
    };

  <!-- アプリ基本ロジック ＆ スワイプで週移動（前週 / 翌週） -->
  <script>
    const CLEANUP_DAYS = 30;

    let base64Image = null;
    window.foodLogs = [];
    let editingLogId = null;
    let selectedDateStr = "";
    let calendarCurrentYear = new Date().getFullYear();
    let calendarCurrentMonth = new Date().getMonth();

    window.userGeminiApiKey = localStorage.getItem('user_gemini_api_key') || "";

    window.userTargets = {
      calories: 2000,
      protein: 100,
      fat: 50,
      carbs: 250
    };

    window.favoritesList = [
      { id: 1, foodName: "ソイプロテイン", calories: 120, protein: 20, fat: 1.5, carbs: 2, isPinned: true },
      { id: 2, foodName: "おにぎり(1個)", calories: 180, protein: 3, fat: 0.5, carbs: 40, isPinned: true }
    ];

    window.onload = function() {
      selectedDateStr = getTodayString();
      loadTargets();
      loadFavorites();
      loadAndCleanupLogs();
      renderWeekDays();
      updateUI();
      initSwipeEvents();
    };

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // スワイプで週全体を移動（前週 / 次の週へ）
    function initSwipeEvents() {
      let touchstartX = 0;
      let startY = 0;
      let touchendX = 0;
      let endY = 0;
      const appContainer = document.getElementById('appContainer');

      appContainer.addEventListener('touchstart', e => {
        touchstartX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
      }, false);

      appContainer.addEventListener('touchend', e => {
        touchendX = e.changedTouches[0].screenX;
        endY = e.changedTouches[0].screenY;
        handleSwipe();
      }, false);

      function handleSwipe() {
        const thresholdX = 80;
        const maxVerticalY = 60;

        const diffX = touchendX - touchstartX;
        const diffY = Math.abs(endY - startY);

        if (diffY > maxVerticalY) return;

        const curDate = new Date(selectedDateStr);

        if (diffX < -thresholdX) {
          // 左スワイプ -> 1週間分先の週へ (+7日)
          curDate.setDate(curDate.getDate() + 7);
          selectedDateStr = formatDateStr(curDate);
          triggerSlideAnimation('slide-left');
          renderWeekDays();
          updateUI();
        } else if (diffX > thresholdX) {
          // 右スワイプ -> 1週間分前の週へ (-7日)
          curDate.setDate(curDate.getDate() - 7);
          selectedDateStr = formatDateStr(curDate);
          triggerSlideAnimation('slide-right');
          renderWeekDays();
          updateUI();
        }
      }
    }

    function triggerSlideAnimation(className) {
      const el = document.getElementById('weekDaysContainer');
      el.classList.remove('slide-left', 'slide-right');
      void el.offsetWidth;
      el.classList.add(className);
    }

    function formatDateStr(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function checkIsDayOver(dateStr) {
      const dayLogs = (window.foodLogs || []).filter(l => l.date === dateStr);
      if (dayLogs.length === 0) return false;

      const sumCal = dayLogs.reduce((s, l) => s + l.calories, 0);
      const sumFat = dayLogs.reduce((s, l) => s + l.fat, 0);
      const sumCarbs = dayLogs.reduce((s, l) => s + l.carbs, 0);

      return (sumCal > window.userTargets.calories) || 
             (sumFat > window.userTargets.fat) || 
             (sumCarbs > window.userTargets.carbs);
    }

    function renderWeekDays() {
      const container = document.getElementById('weekDaysContainer');
      const weekLabels = ["日", "月", "火", "水", "木", "金", "土"];
      
      let html = "";
      const selectedDate = new Date(selectedDateStr);

      for (let i = -3; i <= 3; i++) {
        const d = new Date(selectedDate);
        d.setDate(selectedDate.getDate() + i);

        const dateStr = formatDateStr(d);
        const dayOfWeek = weekLabels[d.getDay()];
        const isSelected = dateStr === selectedDateStr;
        const isToday = dateStr === getTodayString();
        const isOver = checkIsDayOver(dateStr);

        let activeClass = "bg-white text-slate-600 hover:bg-slate-50";

        if (isSelected) {
          activeClass = "bg-emerald-500 text-white font-bold shadow-md scale-105";
        } else if (isOver) {
          activeClass = "bg-rose-100 text-rose-700 font-bold border border-rose-200";
        }

        html += `
          <button onclick="selectDateFromTab('${dateStr}')" class="py-2 px-0.5 rounded-xl text-xs transition-all duration-200 flex flex-col items-center justify-center ${activeClass}">
            <span class="text-[9px] opacity-80">${isToday ? '今日' : dayOfWeek}</span>
            <span class="font-bold text-xs leading-tight">${d.getDate()}日</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function selectDateFromTab(dateStr) {
      selectedDateStr = dateStr;
      renderWeekDays();
      updateUI();
    }

    window.openCalendarModal = function() {
      const cur = new Date(selectedDateStr);
      calendarCurrentYear = cur.getFullYear();
      calendarCurrentMonth = cur.getMonth();
      renderCalendarGrid();
      document.getElementById('calendarModal').classList.remove('hidden');
    };

    window.closeCalendarModal = function() {
      document.getElementById('calendarModal').classList.add('hidden');
    };

    window.changeCalendarMonth = function(delta) {
      calendarCurrentMonth += delta;
      if (calendarCurrentMonth < 0) {
        calendarCurrentMonth = 11;
        calendarCurrentYear--;
      } else if (calendarCurrentMonth > 11) {
        calendarCurrentMonth = 0;
        calendarCurrentYear++;
      }
      renderCalendarGrid();
    };

    function renderCalendarGrid() {
      document.getElementById('calendarMonthTitle').textContent = `${calendarCurrentYear}年 ${calendarCurrentMonth + 1}月`;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = "";

      const firstDay = new Date(calendarCurrentYear, calendarCurrentMonth, 1).getDay();
      const daysInMonth = new Date(calendarCurrentYear, calendarCurrentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const monthStr = String(calendarCurrentMonth + 1).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateStr = `${calendarCurrentYear}-${monthStr}-${dayStr}`;

        const dayLogs = (window.foodLogs || []).filter(l => l.date === dateStr);
        let colorClass = "hover:bg-slate-100 text-slate-700";

        if (dayLogs.length > 0) {
          const isOver = checkIsDayOver(dateStr);
          colorClass = isOver ? "calendar-day-red shadow-sm" : "calendar-day-green shadow-sm";
        }

        const isSelected = dateStr === selectedDateStr ? "ring-2 ring-emerald-500 font-bold" : "";

        grid.innerHTML += `
          <button onclick="selectDateFromCalendar('${dateStr}')" class="py-2 text-center rounded-xl transition ${colorClass} ${isSelected}">
            ${day}
          </button>
        `;
      }
    }

    window.selectDateFromCalendar = function(dateStr) {
      selectedDateStr = dateStr;
      renderWeekDays();
      updateUI();
      closeCalendarModal();
    };

    function getActiveGeminiApiKey() {
      const apiKey = window.userGeminiApiKey || localStorage.getItem('user_gemini_api_key');
      if (!apiKey) {
        alert("Gemini APIキーが設定されていません。右上の「⚙️ 設定」からキーを入力してください。");
        return null;
      }
      return apiKey.trim();
    }

    async function analyzePhotoAndFillForm(event) {
      const activeKey = getActiveGeminiApiKey();
      if (!activeKey) return;

      const file = event.target.files[0];
      if (!file) return;

      const manualAddBtn = document.getElementById('manualAddBtn');
      const manualLoading = document.getElementById('manualLoading');
      const loadingText = document.getElementById('loadingText');
      const aiStatusBadge = document.getElementById('aiStatusBadge');

      const reader = new FileReader();
      reader.onload = async function(e) {
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('previewContainer').classList.remove('hidden');
        base64Image = e.target.result.split(',')[1];

        manualAddBtn.disabled = true;
        loadingText.textContent = "AIが写真から栄養成分を解析中...";
        manualLoading.classList.remove('hidden');
        aiStatusBadge.classList.add('hidden');

        const promptText = `添付された料理の写真から以下を推測し、指定のJSON形式のみで出力してください。数値部分（calories, protein, fat, carbs）は数値のみ（単位なし）で入れてください。

{
  "foodName": "料理名",
  "calories": 数値(kcal),
  "protein": 数値(g),
  "fat": 数値(g),
  "carbs": 数値(g)
}`;

        const candidateModels = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-1.5-flash"];
        let successData = null;

        for (const model of candidateModels) {
          try {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeKey}`;
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { text: promptText },
                    { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                  ]
                }]
              })
            });

            const data = await response.json();
            if (!data.error) {
              successData = data;
              break;
            }
          } catch (err) {}
        }

        try {
          if (successData) {
            const rawText = successData.candidates[0].content.parts[0].text;
            const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(cleanJson);

            document.getElementById('manualName').value = parsed.foodName || "";
            document.getElementById('manualCalories').value = parsed.calories || "";
            document.getElementById('manualProtein').value = parsed.protein || "";
            document.getElementById('manualFat').value = parsed.fat || "";
            document.getElementById('manualCarbs').value = parsed.carbs || "";

            aiStatusBadge.classList.remove('hidden');
          } else {
            alert('写真の解析に失敗しました。APIキーまたは写真をご確認ください。');
          }
        } catch (err) {
          alert('解析データの取得に失敗しました。');
        } finally {
          manualLoading.classList.add('hidden');
          manualAddBtn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    }

    function clearPhotoPreview() {
      base64Image = null;
      document.getElementById('albumInput').value = "";
      document.getElementById('cameraInput').value = "";
      document.getElementById('previewContainer').classList.add('hidden');
      document.getElementById('aiStatusBadge').classList.add('hidden');
    }

    async function callGeminiTextAPI(promptText) {
      const activeKey = getActiveGeminiApiKey();
      if (!activeKey) throw new Error("Gemini APIキーが設定されていません。");

      const candidateModels = ["gemini-2.5-flash", "gemini-2.5-flash-lite", "gemini-1.5-flash"];
      let lastError = null;

      for (const model of candidateModels) {
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeKey}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
          });

          const data = await response.json();
          if (data.error) throw new Error(`[${model}] ${data.error.message}`);
          return data;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("API呼び出しに失敗しました。");
    }

    async function addManualLog() {
      const nameInput = document.getElementById('manualName');
      const calInput = document.getElementById('manualCalories');
      const pInput = document.getElementById('manualProtein');
      const fInput = document.getElementById('manualFat');
      const cInput = document.getElementById('manualCarbs');

      const name = nameInput.value.trim();
      let cal = calInput.value !== "" ? parseFloat(calInput.value) : null;
      let p = pInput.value !== "" ? parseFloat(pInput.value) : null;
      let f = fInput.value !== "" ? parseFloat(fInput.value) : null;
      let c = cInput.value !== "" ? parseFloat(cInput.value) : null;

      if (!name) {
        alert('料理名・食品名を入力してください。');
        return;
      }

      if (cal === null || p === null || f === null || c === null) {
        const manualAddBtn = document.getElementById('manualAddBtn');
        const manualLoading = document.getElementById('manualLoading');
        const loadingText = document.getElementById('loadingText');
        
        manualAddBtn.disabled = true;
        loadingText.textContent = "AIが未入力数値を推測中...";
        manualLoading.classList.remove('hidden');

        try {
          const promptText = `食品名「${name}」の一般的な栄養成分（1食分）を推測してください。
指定値（null以外）はそのまま、nullの項目のみ補完してください。
calories: ${cal}, protein: ${p}, fat: ${f}, carbs: ${c}

指定のJSON形式のみ出力してください:
{"calories":数値, "protein":数値, "fat":数値, "carbs":数値}`;

          const data = await callGeminiTextAPI(promptText);
          const rawText = data.candidates[0].content.parts[0].text;
          const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanJson);

          if (cal === null) cal = parseFloat(parsed.calories) || 0;
          if (p === null) p = parseFloat(parsed.protein) || 0;
          if (f === null) f = parseFloat(parsed.fat) || 0;
          if (c === null) c = parseFloat(parsed.carbs) || 0;
        } catch (err) {
          alert('AIによる自動推定に失敗しました: ' + err.message);
          manualLoading.classList.add('hidden');
          manualAddBtn.disabled = false;
          return;
        } finally {
          manualLoading.classList.add('hidden');
          manualAddBtn.disabled = false;
        }
      }

      window.foodLogs.push({
        id: Date.now(),
        date: selectedDateStr,
        foodName: name,
        calories: cal || 0,
        protein: p || 0,
        fat: f || 0,
        carbs: c || 0
      });

      saveLogsToStorage();
      updateUI();
      renderWeekDays();

      nameInput.value = '';
      calInput.value = '';
      pInput.value = '';
      fInput.value = '';
      cInput.value = '';
      clearPhotoPreview();
    }

    function renderSelectFavoriteList() {
      const query = (document.getElementById('favSearchInput').value || "").toLowerCase().trim();
      const el = document.getElementById('selectFavoriteList');

      const sortedList = [...(window.favoritesList || [])].sort((a, b) =>

              ${item.isPinned ? '⭐' : '☆'}

            <div class="truncate">
              <div class="font-bold text-slate-800 text-xs truncate">${item.foodName}</div>
              <div class="text-[10px] text-slate-400 mt-0.5">${item.calories}kcal / P:${item.protein}g F:${item.fat}g C:${item.carbs}g</div>
            </div>

      if (!item) return;

      window.foodLogs.push({
        id: Date.now(),
        date: selectedDateStr,
        foodName: item.foodName,
        calories: item.calories,
        protein: item.protein,
        fat: item.fat,
        carbs: item.carbs

    window.openFavoriteModal = function() {
      renderFavoriteManageList();
      document.getElementById('favoriteModal').classList.remove('hidden');
    };

    window.closeFavoriteModal = function() {
      document.getElementById('favoriteModal').classList.add('hidden');
    };

    window.addNewFavorite = function() {
      const name = document.getElementById('favInputName').value.trim();
      const cal = parseFloat(document.getElementById('favInputCalories').value) || 0;
      const p = parseFloat(document.getElementById('favInputProtein').value) || 0;
      const f = parseFloat(document.getElementById('favInputFat').value) || 0;
      const c = parseFloat(document.getElementById('favInputCarbs').value) || 0;
      const isPinned = document.getElementById('favInputPinned').checked;

      if (!name) {
        alert('料理名を入力してください');
        return;
      }

      window.favoritesList.push({
        id: Date.now(),
        foodName: name,
        calories: cal,
        protein: p,
        fat: f,
        carbs: c,
        isPinned: isPinned
      });

      saveFavorites();
      renderFavoritesUI();
      renderFavoriteManageList();

      document.getElementById('favInputName').value = '';
      document.getElementById('favInputCalories').value = '';
      document.getElementById('favInputProtein').value = '';
      document.getElementById('favInputFat').value = '';
      document.getElementById('favInputCarbs').value = '';
      document.getElementById('favInputPinned').checked = false;
    };

    window.toggleFavoritePin = function(id) {
      window.favoritesList = window.favoritesList.map(item => {
        if (item.id === id) {
          return { ...item, isPinned: !item.isPinned };
        }
        return item;
      });
      saveFavorites();
      renderFavoritesUI();
      renderFavoriteManageList();
    };

    window.deleteFavorite = function(id) {
      window.favoritesList = window.favoritesList.filter(f => f.id !== id);
      saveFavorites();
      renderFavoritesUI();
      renderFavoriteManageList();
    };

    function renderFavoriteManageList() {
      const el = document.getElementById('favoriteManageList');
      if (!window.favoritesList || window.favoritesList.length === 0) {
        el.innerHTML = '<p class="text-slate-400 text-center py-2">登録なし</p>';
        return;
      }
      
      const sortedList = [...(window.favoritesList || [])].sort((a, b) => 
        a.foodName.localeCompare(b.foodName, 'ja')
      );

      el.innerHTML = sortedList.map(item => `
        <div class="flex justify-between items-center bg-slate-50 p-2 rounded-xl border border-slate-200">
          <div class="flex items-center space-x-1.5">
            <button onclick="toggleFavoritePin(${item.id})" class="text-base" title="TOPへの固定切替">
              ${item.isPinned ? '⭐' : '☆'}
            </button>
            <div>
              <div class="font-bold text-slate-700">${item.foodName}</div>
              <div class="text-[10px] text-slate-400">${item.calories}kcal / P:${item.protein}g F:${item.fat}g C:${item.carbs}g</div>
            </div>
          </div>
          <button onclick="deleteFavorite(${item.id})" class="text-rose-500 font-bold px-2 hover:bg-rose-50 rounded text-xs">削除</button>
        </div>
      `).join('');
    }

    function loadTargets() {
      const savedTargets = localStorage.getItem('userTargets');
      if (savedTargets) {
        try { window.userTargets = JSON.parse(savedTargets); } catch(e) {}
      }
    }

    function saveTargets() {
      localStorage.setItem('userTargets', JSON.stringify(window.userTargets));
      if (window.syncDataToCloud) window.syncDataToCloud();
    }

    window.openTargetModal = function() {
      document.getElementById('inputGeminiApiKey').value = window.userGeminiApiKey || "";
      document.getElementById('inputTargetCalories').value = window.userTargets.calories;
      document.getElementById('inputTargetProtein').value = window.userTargets.protein;
      document.getElementById('inputTargetFat').value = window.userTargets.fat;
      document.getElementById('inputTargetCarbs').value = window.userTargets.carbs;
      document.getElementById('targetModal').classList.remove('hidden');
    };

    window.closeTargetModal = function() {
      document.getElementById('targetModal').classList.add('hidden');
    };

    window.saveTargetValues = function() {
      const apiKeyVal = document.getElementById('inputGeminiApiKey').value.trim();
      window.userGeminiApiKey = apiKeyVal;
      localStorage.setItem('user_gemini_api_key', apiKeyVal);

      const cal = parseFloat(document.getElementById('inputTargetCalories').value) || 2000;
      const p = parseFloat(document.getElementById('inputTargetProtein').value) || 100;
      const f = parseFloat(document.getElementById('inputTargetFat').value) || 50;
      const c = parseFloat(document.getElementById('inputTargetCarbs').value) || 250;

      window.userTargets = { calories: cal, protein: p, fat: f, carbs: c };
      saveTargets();
      updateUI();
      renderWeekDays();
      closeTargetModal();
    };

    function loadAndCleanupLogs() {
      const savedLogs = localStorage.getItem('foodLogs_v2');
      if (savedLogs) {
        try {
          const parsed = JSON.parse(savedLogs);
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - CLEANUP_DAYS);
          const cutoffStr = formatDateStr(cutoffDate);

          window.foodLogs = parsed.filter(item => item.date >= cutoffStr);
          saveLogsToStorage();
        } catch (e) {
          window.foodLogs = [];
        }
      }
    }

    function saveLogsToStorage() {
      localStorage.setItem('foodLogs_v2', JSON.stringify(window.foodLogs));
      if (window.syncDataToCloud) window.syncDataToCloud();
    }

    window.openEditModal = function(id) {
      const item = window.foodLogs.find(log => log.id === id);
      if (!item) return;

      editingLogId = id;
      document.getElementById('editName').value = item.foodName;
      document.getElementById('editCalories').value = item.calories;
      document.getElementById('editProtein').value = item.protein;
      document.getElementById('editFat').value = item.fat;
      document.getElementById('editCarbs').value = item.carbs;

      document.getElementById('editModal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      editingLogId = null;
      document.getElementById('editModal').classList.add('hidden');
    };

    window.saveEditedLog = function() {
      if (!editingLogId) return;

      const name = document.getElementById('editName').value.trim();
      const cal = parseFloat(document.getElementById('editCalories').value) || 0;
      const p = parseFloat(document.getElementById('editProtein').value) || 0;
      const f = parseFloat(document.getElementById('editFat').value) || 0;
      const c = parseFloat(document.getElementById('editCarbs').value) || 0;

      if (!name) {
        alert('料理名・食品名を入力してください。');
        return;
      }

      window.foodLogs = window.foodLogs.map(item => {
        if (item.id === editingLogId) {
          return {
            ...item,
            foodName: name,
            calories: cal,
            protein: p,
            fat: f,
            carbs: c
          };
        }
        return item;
      });

      saveLogsToStorage();
      updateUI();
      renderWeekDays();
      closeEditModal();
    };

    window.duplicateLog = function(id) {
      const original = window.foodLogs.find(item => item.id === id);
      if (!original) return;

      window.foodLogs.push({
        id: Date.now(),
        date: selectedDateStr,
        foodName: original.foodName,
        calories: original.calories,
        protein: original.protein,
        fat: original.fat,
        carbs: original.carbs
      });

      saveLogsToStorage();
      updateUI();
      renderWeekDays();
    };

    window.deleteLog = function(id) {
      window.foodLogs = window.foodLogs.filter(item => item.id !== id);
      saveLogsToStorage();
      updateUI();
      renderWeekDays();
    };

    window.clearCurrentDateLog = function() {
      if (confirm(`${selectedDateStr} の記録をすべて削除しますか？`)) {
        window.foodLogs = window.foodLogs.filter(item => item.date !== selectedDateStr);
        saveLogsToStorage();
        updateUI();
        renderWeekDays();
      }
    };

    window.updateUI = function() {
      document.getElementById('dateBadge').textContent = selectedDateStr;

      renderFavoritesUI();

      document.getElementById('targetCaloriesDisplay').textContent = window.userTargets.calories;
      document.getElementById('targetProteinDisplay').textContent = window.userTargets.protein;
      document.getElementById('targetFatDisplay').textContent = window.userTargets.fat;
      document.getElementById('targetCarbsDisplay').textContent = window.userTargets.carbs;

      const filteredLogs = (window.foodLogs || []).filter(item => item.date === selectedDateStr);

      const totalCal = filteredLogs.reduce((sum, item) => sum + item.calories, 0);
      const totalP = filteredLogs.reduce((sum, item) => sum + item.protein, 0);
      const totalF = filteredLogs.reduce((sum, item) => sum + item.fat, 0);
      const totalC = filteredLogs.reduce((sum, item) => sum + item.carbs, 0);

      const roundedCal = Math.round(totalCal);
      const roundedP = Math.round(totalP * 10) / 10;
      const roundedF = Math.round(totalF * 10) / 10;
      const roundedC = Math.round(totalC * 10) / 10;

      // カロリー判定
      const totalCalEl = document.getElementById('totalCalories');
      const barCalEl = document.getElementById('barCalories');
      totalCalEl.textContent = roundedCal;
      if (totalCal > window.userTargets.calories) {
        totalCalEl.className = "text-2xl font-black text-rose-500 animate-pulse";
        barCalEl.className = "bg-rose-500 h-full transition-all duration-300";
      } else {
        totalCalEl.className = "text-2xl font-black text-emerald-600";
        barCalEl.className = "bg-emerald-500 h-full transition-all duration-300";
      }

      // タンパク質
      const totalPEl = document.getElementById('totalProtein');
      totalPEl.textContent = roundedP;

      // 脂質
      const totalFEl = document.getElementById('totalFat');
      const barFEl = document.getElementById('barFat');
      totalFEl.textContent = roundedF;
      if (totalF > window.userTargets.fat) {
        totalFEl.className = "text-rose-500 font-bold animate-pulse";
        barFEl.className = "bg-rose-500 h-full transition-all duration-300";
      } else {
        totalFEl.className = "text-amber-600 font-bold";
        barFEl.className = "bg-amber-500 h-full transition-all duration-300";
      }

      // 炭水化物
      const totalCEl = document.getElementById('totalCarbs');
      const barCEl = document.getElementById('barCarbs');
      totalCEl.textContent = roundedC;
      if (totalC > window.userTargets.carbs) {
        totalCEl.className = "text-rose-500 font-bold animate-pulse";
        barCEl.className = "bg-rose-500 h-full transition-all duration-300";
      } else {
        totalCEl.className = "text-emerald-600 font-bold";
        barCEl.className = "bg-emerald-500 h-full transition-all duration-300";
      }

      barCalEl.style.width = `${Math.min(100, (totalCal / window.userTargets.calories) * 100)}%`;
      document.getElementById('barProtein').style.width = `${Math.min(100, (totalP / window.userTargets.protein) * 100)}%`;
      barFEl.style.width = `${Math.min(100, (totalF / window.userTargets.fat) * 100)}%`;
      barCEl.style.width = `${Math.min(100, (totalC / window.userTargets.carbs) * 100)}%`;

      // サマリー表示
      const habitSummaryStatus = document.getElementById('habitSummaryStatus');
      const isOverNonProtein = (totalCal > window.userTargets.calories) || 
                               (totalF > window.userTargets.fat) || 
                               (totalC > window.userTargets.carbs);

      if (filteredLogs.length > 0) {
        habitSummaryStatus.classList.remove('hidden');
        if (isOverNonProtein) {
          habitSummaryStatus.className = "p-2.5 rounded-2xl text-xs font-bold flex justify-between items-center bg-rose-50 text-rose-700 border border-rose-200";
          habitSummaryStatus.innerHTML = `<span>⚠️ 目標管理: カロリー/脂質/炭水化物が目標値を超過しています</span>`;
        } else {
          habitSummaryStatus.className = "p-2.5 rounded-2xl text-xs font-bold flex justify-between items-center bg-emerald-50 text-emerald-700 border border-emerald-200";
          habitSummaryStatus.innerHTML = `<span>✅ 目標管理: 適切な範囲内に収まっています</span>`;
        }
      } else {
        habitSummaryStatus.classList.add('hidden');
      }

      const logListEl = document.getElementById('logList');
      if (filteredLogs.length === 0) {
        logListEl.innerHTML = `<p class="text-center py-6 text-slate-400 font-medium">${selectedDateStr} の記録はありません</p>`;
        return;
      }

      logListEl.innerHTML = filteredLogs.map(item => `
        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-200/80 shadow-sm hover:border-slate-300 transition">
          <div class="flex-1 pr-2 cursor-pointer" onclick="openEditModal(${item.id})" title="タップして編集">
            <div class="font-bold text-slate-800 flex items-center space-x-1 text-xs">
              <span>${item.foodName}</span>
              <span class="text-[10px] text-slate-400">✏️</span>
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5">P:${item.protein}g / F:${item.fat}g / C:${item.carbs}g</div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="font-bold text-slate-700 text-xs">${item.calories} <span class="text-[9px] font-normal text-slate-400">kcal</span></span>
            <button onclick="duplicateLog(${item.id})" title="同じものをもう1回食べた" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-2 py-1 rounded-xl text-[10px] transition active:scale-95 shadow-sm">
              +1回
            </button>
            <button onclick="deleteLog(${item.id})" title="削除" class="text-slate-300 hover:text-rose-500 font-bold px-1 text-sm transition">
              ×
            </button>
          </div>
        </div>
      `).join('');
    };
  </script>
</body>
</html>
